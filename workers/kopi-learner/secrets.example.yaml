# kopi-learner has no secrets of its own.
#
# Credentials and endpoints are read from kopi-editor's env.yaml (the file its
# `manage.py deploy` / `settings` already wrote):
#   - ANTHROPIC_API_KEY   -> the Opus teacher
#   - BASE_URL / JOB_TOKEN -> the served Qwen3 vLLM endpoint
#   - ANTHROPIC_MODEL      -> which Anthropic model to distil from
#
# Set them once in kopi-editor; kopi-learner reuses them. Standard env vars
# (ANTHROPIC_API_KEY, KOPI_BASE_URL, KOPI_JOB_TOKEN) still override if present.
