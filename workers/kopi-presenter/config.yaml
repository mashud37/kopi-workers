# ============================================================
# kopi-presenter configuration
# ============================================================
# SECRETS: Do NOT edit this file directly.
# Copy to config.local.yaml, fill in your API key there.
# config.local.yaml is gitignored and never committed.
#
# Environment variable override: set ANTHROPIC_API_KEY to
# avoid file-based secrets entirely.
# ============================================================

api:
  # Anthropic API key: get from https://console.anthropic.com/
  anthropic_key: "YOUR_ANTHROPIC_API_KEY_HERE"

llm:
  # ── Model selection ────────────────────────────────────────
  # claude-haiku-4-5-20251001   cheapest; ~$0.02–0.03/deck    ← default
  # claude-sonnet-5-5            balanced
  # claude-opus-5-5              highest quality
  #
  # Recommendation for manuscript length:
  #   < 3 000 words / outlines → Haiku (excellent results)
  #   3 000–8 000 words paper  → Haiku (good) or Sonnet (better argument selection)
  #   > 8 000 words / complex  → Sonnet strongly recommended
  model: "claude-haiku-4-5-20251001"

  # Max output tokens: full manuscript decks need ~5–6k plus the model's thinking
  max_tokens: 16000

defaults:
  # Used when the manuscript does not state these explicitly.
  author:      "Your Name"
  affiliation: "Your Institution"
  email:       "you@example.com"
  venue:       ""   # leave blank and use --venue flag per presentation

render:
  # Icon set for glyphs (iconrow, headers, accents):
  #   fluent  → Segoe Fluent Icons (default; recoloured vector glyphs)
  #   emoji   → colour emoji  (also via the --emoji flag)
  icons: "fluent"

linter:
  # Automatically call the LLM once to repair validation errors
  auto_repair: true
