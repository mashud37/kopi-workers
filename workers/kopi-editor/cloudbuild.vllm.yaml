substitutions:
  _KOPI_MODEL: Qwen/Qwen3-32B-AWQ
  _IMAGE: europe-west4-docker.pkg.dev/academics-499116/kopi/kopi-editor-vllm:latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.vllm
      - --build-arg
      - KOPI_MODEL=${_KOPI_MODEL}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

timeout: 3000s
