package: kopi-workers
version: "0.1.0"
summary: "Copy-editing and presentation tools for academic prose: edit a manuscript, measure what rules alone can do, and turn a paper into a slide deck."
license: "MIT"
python: ">=3.10"

base:
  - pyyaml
  - flask

apps:
  kopi-editor:
    released: false
    leave_out:
      - tests
  kopi-linter:
    released: false
    leave_out:
      - experiments
  kopi-learner:
    released: false
    leave_out: []
  kopi-presenter:
    released: false
    leave_out: []
  kopi-console:
    released: false
    leave_out: []
